name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Manual runs build/package artifacts only; publication is tag-push-only.
env:
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-ci' }}

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            platform: linux
            bin-dir: target/x86_64-unknown-linux-gnu/release
            features: sound,gui,client-retail
          - name: mists-linux-x86_64
            os: ubuntu-latest
            platform: linux
            bin-dir: target/x86_64-unknown-linux-gnu/release
            features: sound,gui,client-mists
          - name: forever-linux-x86_64
            os: ubuntu-latest
            platform: linux
            bin-dir: target/x86_64-unknown-linux-gnu/release
            features: sound,gui,client-wowforever
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            bin-dir: target/x86_64-pc-windows-msvc/release
            features: sound,gui,client-retail
          - name: mists-windows-x86_64
            os: windows-latest
            platform: windows
            bin-dir: target/x86_64-pc-windows-msvc/release
            features: sound,gui,client-mists
          - name: forever-windows-x86_64
            os: windows-latest
            platform: windows
            bin-dir: target/x86_64-pc-windows-msvc/release
            features: sound,gui,client-wowforever
          - name: macos-aarch64
            os: macos-latest
            platform: macos
            bin-dir: target/aarch64-apple-darwin/release
            features: sound,gui,client-retail
          - name: mists-macos-aarch64
            os: macos-latest
            platform: macos
            bin-dir: target/aarch64-apple-darwin/release
            features: sound,gui,client-mists
          - name: forever-macos-aarch64
            os: macos-latest
            platform: macos
            bin-dir: target/aarch64-apple-darwin/release
            features: sound,gui,client-wowforever

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Use CI cargo config
        shell: pwsh
        run: Copy-Item .cargo/config.ci.toml .cargo/config.toml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libicu-dev libasound2-dev libudev-dev

      - name: Install macOS ICU
        if: runner.os == 'macOS' && (contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-wowforever'))
        shell: bash
        run: |
          brew install icu4c pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Read pinned vcpkg revision
        if: runner.os == 'Windows' && (contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-wowforever'))
        id: vcpkg-pin
        shell: pwsh
        run: |
          $revision = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid vcpkg baseline' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned vcpkg
        if: runner.os == 'Windows' && (contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-wowforever'))
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-pin.outputs.revision }}
          path: .ci-vcpkg
          persist-credentials: false

      - name: Install static Windows ICU
        if: runner.os == 'Windows' && (contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-wowforever'))
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '.ci-vcpkg'
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & "$root/vcpkg.exe" install --triplet x64-windows-static-md --host-triplet x64-windows-static-md "--x-manifest-root=$env:GITHUB_WORKSPACE" "--x-install-root=$root/installed"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg ICU installation failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          'VCPKGRS_TRIPLET=x64-windows-static-md' >> $env:GITHUB_ENV

      - name: Report Unix ICU versions
        if: runner.os != 'Windows' && (contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-wowforever'))
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --atleast-version=72 icu-i18n icu-uc
          pkg-config --modversion icu-i18n icu-uc

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Sync Cargo.toml version to release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          python3 - "$version" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          text, n = re.subn(r'^version = "[^"]+"',
                            f'version = "{v}"',
                            text, count=1, flags=re.MULTILINE)
          if n != 1:
              sys.exit("failed to patch version in Cargo.toml")
          p.write_text(text)
          PY
          grep '^version' Cargo.toml | head -1

      - name: Build release binaries
        env:
          WOW_UI_SIM_RELEASE_FEATURES: ${{ matrix.features }}
        run: cargo release-${{ matrix.platform }}

      - name: Generate Forever spell data
        if: contains(matrix.features, 'client-wowforever')
        shell: bash
        run: |
          set -euo pipefail
          cli="${{ matrix.bin-dir }}/wow-cli"
          if [[ "${{ runner.os }}" == "Windows" ]]; then cli="${cli}.exe"; fi
          "${cli}" casc sync-forever-spells --source cdn --output "${RUNNER_TEMP}/forever-spells.json"

      - name: Generate dungeon score rarity cache
        if: contains(matrix.features, 'client-retail') || contains(matrix.features, 'client-ptr')
        shell: bash
        run: |
          set -euo pipefail
          cli="${{ matrix.bin-dir }}/wow-cli"
          if [[ "${{ runner.os }}" == "Windows" ]]; then cli="${cli}.exe"; fi
          "${cli}" casc sync-dungeon-score-rarity --output "${RUNNER_TEMP}/dungeon-score-rarity.json"

      - name: Smoke-test release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="${{ matrix.bin-dir }}/wow-sim.exe"
          else
            bin="${{ matrix.bin-dir }}/wow-sim"
          fi
          echo "--- ${bin} --version ---"
          "${bin}" --version
          expected="wow-sim ${RELEASE_REF#v}"
          actual="$("${bin}" --version)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "version mismatch: expected '${expected}', got '${actual}'" >&2
            exit 1
          fi

      - name: Package Linux release
        if: runner.os == 'Linux'
        id: package-linux
        shell: bash
        run: |
          set -euo pipefail
          name="wow-ui-sim-${RELEASE_REF}-${{ matrix.name }}"
          root="dist/${name}"

          mkdir -p "${root}"
          cp "${{ matrix.bin-dir }}/wow-sim" "${root}/"
          if [[ "${{ matrix.features }}" == *client-wowforever* ]]; then
            cp "${{ matrix.bin-dir }}/wow-cli" "${root}/"
            mkdir -p "${root}/spells/wowforever"
            cp "${RUNNER_TEMP}/forever-spells.json" "${root}/spells/wowforever/spells.json"
          fi
          if [[ "${{ matrix.features }}" == *client-retail* || "${{ matrix.features }}" == *client-ptr* ]]; then
            profile=retail; [[ "${{ matrix.features }}" == *client-ptr* ]] && profile=ptr
            mkdir -p "${root}/dungeon-score-rarity/${profile}"
            cp "${RUNNER_TEMP}/dungeon-score-rarity.json" "${root}/dungeon-score-rarity/${profile}/rarity.json"
          fi
          cp README.md LICENSE "${root}/"
          mkdir -p "${root}/Interface/AddOns"
          cp -R Interface/AddOns/Admin Interface/AddOns/SimCommands Interface/AddOns/TestFramework "${root}/Interface/AddOns/"

          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "asset=dist/${name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ env.RELEASE_REF }}-${{ matrix.name }}
          path: ${{ steps.package-linux.outputs.asset }}

      - name: Package macOS release
        if: runner.os == 'macOS'
        id: package-macos
        shell: bash
        run: |
          set -euo pipefail
          name="wow-ui-sim-${RELEASE_REF}-${{ matrix.name }}"
          version="${RELEASE_REF#v}"
          app_name="WoW Sim"
          bundle_id="net.osso.wow-ui-sim"
          if [[ "${{ matrix.features }}" == *client-wowforever* ]]; then
            app_name="WoW Sim Forever"
            bundle_id="net.osso.wow-ui-sim.forever"
          fi
          app="dist/${app_name}.app"
          contents="${app}/Contents"

          # Generate the source PNG for the iconset (also writes the ICO,
          # which is unused on macOS).
          cargo run --example gen_app_icon --no-default-features --features "${{ matrix.features }}"

          # Build a multi-size iconset from the rendered PNG and convert
          # to .icns. Source is 128x128, so larger sizes are upscaled.
          iconset="dist/wow-sim.iconset"
          rm -rf "${iconset}"
          mkdir -p "${iconset}"
          for size in 16 32 64 128 256 512 1024; do
            sips -z "$size" "$size" installer/wow-sim.png \
              --out "${iconset}/icon_${size}x${size}.png" >/dev/null
          done
          # Retina variants for sizes <= 512 (point size + @2x suffix).
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" installer/wow-sim.png \
              --out "${iconset}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${iconset}" -o "dist/wow-sim.icns"

          # Assemble the .app bundle.
          rm -rf "${app}"
          mkdir -p "${contents}/MacOS" "${contents}/Resources/Interface/AddOns"
          cp "${{ matrix.bin-dir }}/wow-sim" "${contents}/MacOS/wow-sim"
          if [[ "${{ matrix.features }}" == *client-wowforever* ]]; then
            cp "${{ matrix.bin-dir }}/wow-cli" "${contents}/MacOS/wow-cli"
            mkdir -p "${contents}/MacOS/spells/wowforever"
            cp "${RUNNER_TEMP}/forever-spells.json" "${contents}/MacOS/spells/wowforever/spells.json"
          fi
          if [[ "${{ matrix.features }}" == *client-retail* || "${{ matrix.features }}" == *client-ptr* ]]; then
            profile=retail; [[ "${{ matrix.features }}" == *client-ptr* ]] && profile=ptr
            mkdir -p "${contents}/MacOS/dungeon-score-rarity/${profile}"
            cp "${RUNNER_TEMP}/dungeon-score-rarity.json" "${contents}/MacOS/dungeon-score-rarity/${profile}/rarity.json"
          fi
          chmod +x "${contents}/MacOS/wow-sim"
          cp dist/wow-sim.icns "${contents}/Resources/wow-sim.icns"
          cp -R Interface/AddOns/Admin Interface/AddOns/SimCommands Interface/AddOns/TestFramework \
            "${contents}/Resources/Interface/AddOns/"

          if [[ "${{ matrix.features }}" == *client-retail* || "${{ matrix.features }}" == *client-wowforever* ]]; then
            python3 "${GITHUB_WORKSPACE}/scripts/bundle-macos-icu.py" \
              "${contents}/MacOS/wow-sim" "$(brew --prefix icu4c)/lib"
            if [[ "${{ matrix.features }}" == *client-wowforever* ]]; then
              python3 "${GITHUB_WORKSPACE}/scripts/bundle-macos-icu.py" \
                "${contents}/MacOS/wow-cli" "$(brew --prefix icu4c)/lib"
            fi
          fi

          # Ad-hoc codesign so macOS reports "unidentified developer"
          # rather than the misleading "damaged and can't be opened"
          # Gatekeeper error on first launch of a quarantined download.
          # The "-" identity is the ad-hoc signature: no Apple Developer
          # cert needed, no notarization, no $99/yr account. Users still
          # need to right-click -> Open to bypass Gatekeeper once.
          cat > "${contents}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>${app_name}</string>
            <key>CFBundleDisplayName</key>     <string>${app_name}</string>
            <key>CFBundleIdentifier</key>      <string>${bundle_id}</string>
            <key>CFBundleVersion</key>         <string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key>      <string>wow-sim</string>
            <key>CFBundleIconFile</key>        <string>wow-sim</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>LSMinimumSystemVersion</key>  <string>11.0</string>
            <key>NSHighResolutionCapable</key> <true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign the assembled bundle. --deep covers any nested
          # ICU dylibs are signed inside-out before the outer bundle.
          if [[ -d "${contents}/Frameworks" ]]; then
            for dylib in "${contents}/Frameworks/"*.dylib; do
              codesign --force --sign - "${dylib}"
            done
          fi
          codesign --force --deep --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

          # Run the packaged executable, not the unbundled build output.
          "${contents}/MacOS/wow-sim" --version

          # Stage a DMG layout: the .app + a symlink to /Applications so
          # users drag-to-install.
          stage="dist/dmg-stage"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -R "${app}" "${stage}/"
          ln -s /Applications "${stage}/Applications"
          cp README.md LICENSE "${stage}/"

          dmg="dist/${name}.dmg"
          rm -f "${dmg}"
          hdiutil create -volname "${app_name} ${version}" \
            -srcfolder "${stage}" \
            -ov -format UDZO \
            "${dmg}"

          echo "asset=${dmg}" >> "${GITHUB_OUTPUT}"

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ env.RELEASE_REF }}-${{ matrix.name }}
          path: ${{ steps.package-macos.outputs.asset }}

      - name: Package Windows release
        if: runner.os == 'Windows'
        id: package-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "wow-ui-sim-$env:RELEASE_REF-${{ matrix.name }}"
          $root = "dist\$name"

          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item "${{ matrix.bin-dir }}\wow-sim.exe" $root
          if ("${{ matrix.features }}" -like "*client-wowforever*") {
            Copy-Item "${{ matrix.bin-dir }}\wow-cli.exe" $root
            New-Item -ItemType Directory -Force "$root\spells\wowforever" | Out-Null
            Copy-Item "$env:RUNNER_TEMP\forever-spells.json" "$root\spells\wowforever\spells.json"
          }
          if ("${{ matrix.features }}" -like "*client-retail*" -or "${{ matrix.features }}" -like "*client-ptr*") {
            $profile = if ("${{ matrix.features }}" -like "*client-ptr*") { "ptr" } else { "retail" }
            New-Item -ItemType Directory -Force "$root\dungeon-score-rarity\$profile" | Out-Null
            Copy-Item "$env:RUNNER_TEMP\dungeon-score-rarity.json" "$root\dungeon-score-rarity\$profile\rarity.json"
          }
          Copy-Item README.md, LICENSE $root
          New-Item -ItemType Directory -Force "$root\Interface\AddOns" | Out-Null
          Copy-Item Interface\AddOns\Admin, Interface\AddOns\SimCommands, Interface\AddOns\TestFramework "$root\Interface\AddOns\" -Recurse

          Compress-Archive -Path $root -DestinationPath "dist\$name.zip" -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $profileArgs = @()
          if ("${{ matrix.features }}" -like "*client-wowforever*") { $profileArgs += "/DForever" }
          & $iscc ".\installer\wow-ui-sim.iss" @profileArgs `
            "/DAppVersion=$env:RELEASE_REF" `
            "/DSourceDir=$((Resolve-Path $root).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            "/DOutputBaseFilename=$name-setup"

          "asset=dist/$name*" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ env.RELEASE_REF }}-${{ matrix.name }}
          path: ${{ steps.package-windows.outputs.asset }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
