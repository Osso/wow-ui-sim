# The `server` feature of iced-layout-inspector pulls in peercred-ipc, which is
# Linux-only (uses SO_PEERCRED — macOS is unix but lacks this socket option).
[target.'cfg(target_os = "linux")'.dependencies]
iced-layout-inspector = { git = "https://github.com/Osso/iced-layout-inspector.git", tag = "v0.2.0", features = ["server"], optional = true }

[build-dependencies]
# Compile/probe the shared private ICU4C shim; older profiles do not activate it.
cc = { version = "=1.2.52", optional = true }
pkg-config = { version = "=0.3.32", optional = true }
vcpkg = { version = "=0.2.15", optional = true }
winresource = "0.1"

[patch.crates-io]
iced_wgpu = { path = "iced-wgpu-patched" }

